# Deploys the static frontend to GitHub Pages from main.
#
# Only the files the browser needs are published. functions/, tests/, scripts/
# and node_modules/ are excluded — not because they are secret, but because
# publishing them enlarges the site and invites confusion about what is live.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deployment needs these; nothing else in the repo does.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A queued run is not cancelled, so a merge train
# still publishes the final state rather than an intermediate one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Tests gate the deployment. This reuses test.yml rather than duplicating it.
  test:
    uses: ./.github/workflows/test.yml

  build:
    name: Build site
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble publishable site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'functions' \
            --exclude 'tests' \
            --exclude 'scripts' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'firebase.json' \
            --exclude '.firebaserc*' \
            --exclude 'firestore.rules' \
            --exclude 'firestore.indexes.json' \
            --exclude 'storage.rules' \
            --exclude '.env*' \
            --exclude '_site' \
            ./ _site/

          # Jekyll would otherwise ignore any file or directory beginning with
          # an underscore. This is the standard GitHub Pages foot-gun.
          touch _site/.nojekyll

      # Stamps the commit SHA so the running app can report exactly what is
      # deployed — essential when debugging a cached service worker later.
      - name: Stamp build version
        run: |
          SHA_SHORT="${GITHUB_SHA::7}"
          sed -i "s/version: '0\.1\.0'/version: '0.1.0+${SHA_SHORT}'/" \
            _site/js/config/constants.js
          echo "Stamped build ${SHA_SHORT}"

      - name: Verify the entry points exist
        run: |
          for f in index.html 404.html manifest.webmanifest \
                   css/tokens.css js/app.js assets/images/icon-512.png; do
            test -f "_site/$f" || { echo "::error::Missing $f in build output"; exit 1; }
          done
          echo "All entry points present."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test the live site
        run: |
          URL="${{ steps.deployment.outputs.page_url }}"
          echo "Deployed to $URL"
          sleep 10
          for path in "" "manifest.webmanifest" "css/tokens.css" "js/app.js"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "${URL}${path}")
            echo "  ${CODE}  ${URL}${path}"
            [ "$CODE" = "200" ] || { echo "::error::${path} returned ${CODE}"; exit 1; }
          done
          echo "Smoke test passed."
